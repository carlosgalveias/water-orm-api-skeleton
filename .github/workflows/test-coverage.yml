name: Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests with coverage
      run: npm run test:coverage > coverage-output.txt 2>&1 || true
      continue-on-error: true
    
    - name: Display coverage output
      run: cat coverage-output.txt
    
    - name: Parse coverage results
      id: coverage
      run: |
        # Extract coverage summary from output
        echo "Coverage report generated"
        # Note: Node.js native coverage format parsing can be added here
        # For now, we'll just capture the output
      continue-on-error: true
    
    - name: Upload coverage output as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-node-${{ matrix.node-version }}
        path: coverage-output.txt
        retention-days: 30
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let coverageOutput = '';
          try {
            coverageOutput = fs.readFileSync('coverage-output.txt', 'utf8');
          } catch (error) {
            coverageOutput = 'Coverage report not available';
          }
          
          // Extract key coverage lines (customize based on actual output format)
          const coverageLines = coverageOutput.split('\n').filter(line => 
            line.includes('|') || line.includes('Coverage') || line.includes('%')
          ).slice(0, 50); // Limit to first 50 relevant lines
          
          const comment = `## Test Coverage Report (Node.js ${{ matrix.node-version }})
          
          \`\`\`
          ${coverageLines.join('\n') || coverageOutput.substring(0, 2000)}
          \`\`\`
          
          📊 Full coverage report is available in the workflow artifacts.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
      continue-on-error: true
    
    - name: Check coverage thresholds
      run: |
        echo "Checking if coverage meets minimum thresholds..."
        # Note: With Node.js native coverage, threshold checking needs custom parsing
        # For now, tests are allowed to fail but coverage is still collected
        echo "Coverage check completed"
      continue-on-error: true

  coverage-summary:
    runs-on: ubuntu-latest
    needs: coverage
    if: always()
    
    steps:
    - name: Coverage Summary
      run: |
        echo "Test coverage workflow completed"
        echo "Coverage reports are available in the artifacts section"